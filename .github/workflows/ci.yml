name: CI

on:
  pull_request:
    branches: [dev, main]
  # SonarQube necesita analizar dev y main para comparar cada pull request.
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Compilar
        run: pnpm build

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Si una sola prueba falla o la cobertura baja del umbral (vite.config.ts), el job falla.
      - name: Todas las pruebas con cobertura
        run: pnpm test:cov

      - name: Guardar la cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov.info
          retention-days: 7

  sonarqube:
    name: SonarQube
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Historia completa: SonarQube la usa para saber qué código es nuevo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Traer la cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage

      # Configuración en sonar-project.properties. Espera la regla de calidad: si no se cumple, el job
      # falla. Acciones de terceros fijadas por el SHA completo (regla de SonarQube).
      - name: Análisis de SonarQube
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # MC-E3: el detalle queda en el registro aunque la regla de calidad falle.
      - name: Detalle de SonarQube
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/sonar-detalle.sh
