# SonarQube Cloud (MC-E3). Organización y proyecto creados por el equipo; el token va en el secreto
# SONAR_TOKEN de GitHub, nunca aquí.
sonar.organization=juanjo0775
sonar.projectKey=JuanJo0775_Sistema_valora_F
sonar.projectName=Sistema_valora_F
sonar.sourceEncoding=UTF-8

# Se dejan fuera los archivos que no son código.
# Los archivos de prueba no cuentan como líneas de código del plan gratuito (tope de 50 000 líneas por
# organización, que el servidor y el frontend juntos pasaban): se marcan como pruebas y quedan fuera del
# código fuente principal. Los dos conjuntos son disjuntos (SonarQube no admite un archivo en ambos).
sonar.exclusions=docs/**,coverage/**,dist/**,**/*.png,**/*.svg,src/shared/api/schema.d.ts,**/*.spec.ts,**/*.spec.tsx,src/test/**,e2e/**
sonar.tests=src,e2e
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,src/test/**,e2e/**

# Cobertura que genera Vitest en el job Pruebas. Las pruebas (también las de extremo a extremo, e2e/) no
# cuentan como código por cubrir.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,src/test/**,src/main.tsx,*.config.ts,*.config.js,scripts/**,e2e/**
