# SonarQube Cloud (MC-E3). Organización y proyecto creados por el equipo; el token va en el secreto
# SONAR_TOKEN de GitHub, nunca aquí.
sonar.organization=juanjo0775
sonar.projectKey=JuanJo0775_Sistema_valora_F
sonar.projectName=Sistema_valora_F
